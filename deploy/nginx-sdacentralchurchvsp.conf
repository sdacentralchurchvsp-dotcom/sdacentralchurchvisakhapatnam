server {
    listen 80;
    listen [::]:80;

    server_name sdacentralchurchvsp.org www.sdacentralchurchvsp.org;

    root /var/www/sdacentralchurchvsp;
    index index.html;

    # Serve files; fall back to 404 page if not found
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets (images, css, js, pdf) for faster repeat visits
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
